<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giorni senza assenze: Cialtrons Loris</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d9d4c7; --sign:#ffcf1f; --ink:#161513; --tile:#161513; --digit:#ffcf1f; --shadow:#0003;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22201c;--shadow:#0008}}
:root[data-theme="dark"]{--bg:#22201c;--shadow:#0008}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);
  font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--ink)}
.sign{width:min(760px,100%);background:var(--sign);border-radius:14px;padding:14px;
  box-shadow:0 14px 0 var(--shadow);position:relative}
.sign::before,.sign::after{content:"";display:block;height:22px;border-radius:6px;
  background:repeating-linear-gradient(-45deg,var(--ink) 0 18px,var(--sign) 18px 36px)}
.inner{padding:26px 18px 22px;text-align:center}
h1{margin:0;font:400 clamp(1.5rem,5.4vw,2.6rem)/1.05 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
h1 span{display:block;font-size:1.35em;margin-top:.15em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,2vw,14px);margin:26px 0 18px}
.cell{background:var(--tile);border-radius:10px;padding:14px 4px 10px;position:relative;overflow:hidden}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#000a}
.num{font:400 clamp(2.2rem,11vw,5rem)/1 Anton,Impact,sans-serif;color:var(--digit);font-variant-numeric:tabular-nums}
.lab{color:#fff;font-weight:700;font-size:clamp(.8rem,3vw,1.15rem);letter-spacing:.04em;margin-top:6px}
.msg{font-weight:700;font-size:clamp(1.05rem,3.6vw,1.5rem);min-height:2.2em;margin:0 0 10px}
.since{font-weight:500;font-size:1rem;opacity:.8;margin:0}
.wiggle{display:inline-block;animation:w 2.4s ease-in-out infinite}
@keyframes w{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.wiggle{animation:none}}
</style>
</head>
<body>
<main class="sign">
  <div class="inner">
    <h1>Quanto tempo passerà per la prossima assenza di<span>Cialtrons Loris?</span></h1>
    <div class="grid" role="timer" aria-live="off">
      <div class="cell"><div class="num" id="d">0</div><div class="lab">GIORNI</div></div>
      <div class="cell"><div class="num" id="h">00</div><div class="lab">ORE</div></div>
      <div class="cell"><div class="num" id="m">00</div><div class="lab">MINUTI</div></div>
      <div class="cell"><div class="num" id="s">00</div><div class="lab">SECONDI</div></div>
    </div>
    <p class="msg"><span class="wiggle">🚧</span> <span id="msg"></span></p>
    <p class="since">Ultima assenza: STAY TUNED</p>
  </div>
</main>
<script>
// Data di partenza del contatore (oggi). Cambiala qui quando Loris si assenta di nuovo.
var START = new Date("2026-09-29T00:00:00+02:00").getTime();
var MSGS = [
  "Presente. Sempre. Sospettosamente.",
  "Nemmeno un raffreddore di cortesia.",
  "Il badge di Loris chiede ferie.",
  "La scrivania lo aspetta ogni mattina. E lo trova.",
  "Record in corso. Nessuno osa fermarlo.",
  "Ormai fa parte dell'arredamento.",
  "Loris non si ammala: ha finito i permessi."
];
function p(n){return String(n).padStart(2,"0")}
function tick(){
  var t = Math.max(0, Date.now() - START), sec = Math.floor(t/1000);
  document.getElementById("d").textContent = Math.floor(sec/86400);
  document.getElementById("h").textContent = p(Math.floor(sec%86400/3600));
  document.getElementById("m").textContent = p(Math.floor(sec%3600/60));
  document.getElementById("s").textContent = p(sec%60);
  document.getElementById("msg").textContent = MSGS[Math.floor(sec/3600) % MSGS.length];
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
